[workspace]
members = ["crates/toki-core"]

[package]
name = "app"
version = "1.0.2"
description = "Toki — desktop tamagotchi/RPG companion"
authors = ["Daekyo-Jeong <dk@dkdk.me>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
toki-core = { path = "crates/toki-core" }
tiny_http = "0.12"
tauri-plugin-dialog = "2.7.1"
ureq = { version = "2", features = ["json"] }

# macOS-only: raw NSWindow/WKWebView access to force full window transparency.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# M10 자유 이동: 토키가 올라설 창 목록(CGWindowList)
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
# M10 자유 이동: EnumWindows + DWM 확장 프레임
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

